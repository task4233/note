name: Checks Typo
on: [push]

jobs:
  run:
    name: Spell Check with Typos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Actions Repository
        uses: actions/checkout@v7

      - name: Use custom config file
        uses: crate-ci/typos@v1.52.0
        with:
          files: ./
          config: ./.github/typos.toml
